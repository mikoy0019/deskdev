name: Mobile CI

on:
  push:
    paths:
      - 'mobile/**'
      - 'scripts/check-shared-drift.mjs'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'scripts/check-shared-drift.mjs'
      - '.github/workflows/mobile-ci.yml'

jobs:
  mobile-checks:
    name: Typecheck, expo-doctor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        run: npm ci
      # expo-env.d.ts is generated by `expo start` and git-ignored; recreate it
      # so tsconfig.json's include resolves. (No eslint config exists in
      # mobile/ yet — add an `expo lint` step here once one is set up.)
      - name: Regenerate expo-env.d.ts
        run: printf '/// <reference types="expo/types" />\n' > expo-env.d.ts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: expo-doctor
        run: npx expo-doctor

  shared-lib-drift:
    name: Shared lib drift (site/src/deskdev/lib must mirror mobile/src/lib)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Check site/src/deskdev/lib vs mobile/src/lib
        run: node scripts/check-shared-drift.mjs
